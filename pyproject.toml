[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-intelligence-platform"
version = "0.1.0"
description = "End-to-end battery cell analytics: cycling-data lakehouse, quality and reliability statistics, early lifetime prediction, and MLOps."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "duckdb>=1.0",
  "dbt-core>=1.10",
  "dbt-duckdb>=1.9",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
real-data = ["h5py>=3.8"]
mlops = ["mlflow>=2.12", "fastapi>=0.110", "uvicorn>=0.29"]
stream = ["kafka-python>=2.0"]
dashboard = ["streamlit>=1.50"]
dev = ["pytest>=8", "httpx>=0.27", "h5py>=3.8", "mlflow>=2.12", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
bip = "bip.cli:main"

[tool.setuptools.packages.find]
include = ["bip*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
